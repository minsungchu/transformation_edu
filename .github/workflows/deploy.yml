name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci가 아니라 npm install을 쓴다: Windows에서 생성된 lockfile에는
      # Linux용 네이티브 optional 패키지(rspack/lightningcss/swc 바인딩) 항목이
      # 빠져 있어(npm cross-platform 버그) ci로는 설치가 누락된다. install은
      # 현재 플랫폼 기준으로 optional deps를 다시 해석해 전부 설치한다.
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build -w site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
