name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Windows에서 생성된 lockfile에는 Linux 네이티브 optional 패키지 항목이
      # 빠져 있고(npm/cli#4828), lockfile이 존재하면 npm install도 누락 항목을
      # 채우지 않는다. rspack 에러 메시지의 공식 권고대로 lockfile을 지우고
      # 새로 해석해서 설치한다 (러너 플랫폼 기준 전체 재해석).
      - name: Install dependencies
        run: |
          rm package-lock.json
          npm install
      - name: Build site
        run: npm run build -w site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
